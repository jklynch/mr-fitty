default_language_version:
    python: python3
repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
  - repo: local
    hooks:
      - id: journal-toc
        name: regenerate dev-journal table of contents
        entry: python3 scripts/gen_toc.py
        language: system
        files: ^dev-journal\.md$
